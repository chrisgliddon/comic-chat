name: Port tests

# The TypeScript/PixiJS port in port/ is the actual deliverable, and its
# oracle-golden tests (port/test/engine/*_oracle.test.ts) are what turn the
# frozen C++ dumps into a regression guard. Nothing ran them in CI until this
# workflow existed: the Windows oracle job only builds and dumps the C++ side.
# This job needs no MSVC, so it runs on Linux in seconds.

# See the branch-model note in oracle.yml: dev is the default branch and is
# absent from every trigger, so it never spends CI. staging and production are
# the gated branches.
#
# This job is ~20s, so if the no-CI-on-dev rule ever chafes, this is the one
# worth reconsidering: `pnpm test` in port/ reproduces it exactly.
on:
  workflow_dispatch:
  push:
    branches:
      - staging
      - production
    paths:
      - ".github/workflows/port-tests.yml"
      - "port/**"
      # The differential tests read the frozen dumps, so a golden re-freeze
      # must re-run them.
      - "oracle/textpose/*.json"
      - "oracle/avatario/*.json"
      - "oracle/avatar/*.json"
      - "oracle/glyphs/*.json"

permissions:
  contents: read

jobs:
  test:
    name: Typecheck and test the TS port
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: port

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # pnpm version comes from the packageManager field in port/package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: port/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: port/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # CI=true makes the *_oracle.test.ts differential suites fail instead of
      # skip when a golden is missing, so a bad path can't read as green.
      - name: Test
        run: pnpm test
        env:
          CI: "true"
