name: Oracle harness

# Branch model: dev is the default branch and runs nothing - it is deliberately
# absent from every trigger below, so day-to-day work on dev never spends CI.
# Promoting dev -> staging is what gates the work; production is gated the same
# way. Nothing here keys off pull_request: this repo promotes by pushing, not by
# opening PRs.
on:
  workflow_dispatch:
  push:
    branches:
      - staging
      - production
    # Deliberately NOT "oracle/**": that spent a 3-minute Windows run on every
    # LEDGER edit. The subdirectories below are the ones that can actually move
    # a golden. Keep this list in sync when adding an oracle subdirectory - a
    # new dump directory left off this list would go unguarded.
    paths:
      - ".github/workflows/oracle.yml"
      - "oracle/harness/**"
      - "oracle/scripts/**"
      - "oracle/schema/**"
      - "oracle/corpus/**"
      - "oracle/glyphs/**"
      - "oracle/textpose/**"
      - "oracle/avatario/**"
      - "oracle/avatar/**"
      - "oracle/codecs/**"
      - "oracle/ccc/**"
      - "oracle/avb/**"
      - "oracle/package.json"
      - "oracle/pnpm-lock.yaml"
      # oracle.mak links essentially the whole v2.5 tree (avatario.obj,
      # textpose.obj, panel.obj, ...), so any engine source can move a
      # golden. Watch the tree, not a hand-picked file list.
      - "v2.5-beta-1-modern/**"
      - "artifacts/inc/**"

permissions:
  contents: read

jobs:
  build-and-run:
    name: Build harness, run judge validation, capture glyphs
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      # pnpm/action-setup must precede setup-node so that `cache: pnpm` can
      # locate the pnpm store. Version comes from oracle/package.json.
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          package_json_file: oracle/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: oracle/pnpm-lock.yaml

      - name: Build the oracle harness
        shell: cmd
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          if not defined VSINSTALL (
            echo No Visual Studio C++ installation was found.
            exit /b 1
          )
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          if errorlevel 1 exit /b 1
          if not exist "%VCToolsInstallDir%ATLMFC\lib\spectre\x86" (
            echo The x86 Spectre-mitigated MFC libraries are missing.
            exit /b 1
          )

          if exist "v2.5-beta-1-modern\Release\oracle" rmdir /s /q "v2.5-beta-1-modern\Release\oracle"
          pushd "v2.5-beta-1-modern"
          nmake /f oracle.mak CFG="oracle - Win32 Release"
          if errorlevel 1 (
            echo HARNESS BUILD FAILED
            exit /b 1
          )
          popd

      # TEMPORARY DIAGNOSTIC - remove once answered.
      #
      # protsupp.cpp:4061 is `extern CString strCurrentChannelTopic;`, but
      # chatprot.h:101 defines that name as an object-like macro
      # (currentRoom->m_strTopic). protsupp.cpp includes chat.h which includes
      # chatprot.h, so the macro should be in scope and the line should expand to
      # `extern CString (currentRoom->m_strTopic);` - which clang rejects and which
      # should not be valid C++ anywhere. Yet MSVC compiles this file.
      #
      # Rather than guess, ask the compiler: preprocess and print what that line
      # actually becomes. Non-fatal, so a red probe cannot block the goldens.
      - name: Diagnostic - preprocess protsupp.cpp around DoChannelDialog
        shell: cmd
        continue-on-error: true
        run: |
          for /f "usebackq delims=" %%I in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%I"
          call "%VSINSTALL%\VC\Auxiliary\Build\vcvars32.bat"
          cd v2.5-beta-1-modern
          cl /nologo /EP /C /D "NDEBUG" /D "ORACLE_HARNESS" /D "_WINDOWS" /D "_MBCS" /D "_AFXDLL" /I "..\artifacts\inc" protsupp.cpp > "%TEMP%\protsupp.i" 2> "%TEMP%\protsupp.err"
          echo ---- preprocessor stderr (tail) ----
          powershell -NoProfile -Command "Get-Content \"$env:TEMP\protsupp.err\" -Tail 8"
          echo ---- expansion around DoChannelDialog ----
          powershell -NoProfile -Command "$f = Get-Content \"$env:TEMP\protsupp.i\"; $i = ($f | Select-String -Pattern 'DoChannelDialog' | Select-Object -First 1).LineNumber; if ($i) { $f[($i-2)..($i+6)] } else { 'DoChannelDialog not found in the preprocessed output' }"
          echo ---- is strCurrentChannelTopic defined as a macro at all? ----
          powershell -NoProfile -Command "Select-String -Path \"$env:TEMP\protsupp.i\" -Pattern 'm_strTopic' | Select-Object -First 5 | ForEach-Object { $_.Line.Trim() }"

      # glyphs.json is a frozen *input* to the port (RULEBOOK 6: the TS side
      # consumes oracle/glyphs/glyphs.json verbatim and never re-measures
      # text), so the committed path stays put and the fresh capture goes to
      # glyphs.actual.json for comparison. Before this guard existed, every
      # run silently overwrote the frozen table - a runner-image or SDK font
      # change would have gone unnoticed.
      - name: Capture glyph tables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path oracle\glyphs | Out-Null
          Set-Location v2.5-beta-1-modern
          $frozen = "..\oracle\glyphs\glyphs.json"
          $capture = if (Test-Path $frozen) { "..\oracle\glyphs\glyphs.actual.json" } else { $frozen }
          & Release\OracleHarness.exe --glyphs $capture
          if ($LASTEXITCODE -ne 0) { Write-Host "GLYPH CAPTURE FAILED (exit $LASTEXITCODE)"; exit 1 }
          Write-Host "Glyphs captured."
          if ($capture -ne $frozen) {
            & node ..\oracle\scripts\diff-dumps.mjs $frozen $capture
            if ($LASTEXITCODE -ne 0) { Write-Host "GLYPH TABLE MISMATCH: frozen oracle/glyphs/glyphs.json no longer matches this runner's capture"; exit 1 }
            Write-Host "Glyph table match."
          } else {
            Write-Host "No frozen glyph table yet - freeze by committing oracle/glyphs/glyphs.json"
          }

      # The three Tier-1 dumps below use pwsh rather than cmd: $LASTEXITCODE
      # after `node diff-dumps.mjs` is unambiguous, whereas nested
      # `if exist (... if errorlevel 1 ...)` batch blocks are exactly the
      # shape that swallowed the corpus diff output before it was moved to
      # pwsh. The mismatch branch of a golden check must never be the
      # unexercised one - a false "golden match" invalidates the oracle.
      - name: Capture textpose (Tier-1 #1 dump)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path oracle\textpose | Out-Null
          Set-Location v2.5-beta-1-modern
          & Release\OracleHarness.exe --textpose ..\oracle\textpose\textpose.json
          if ($LASTEXITCODE -ne 0) { Write-Host "TEXTPOSE CAPTURE FAILED (exit $LASTEXITCODE)"; exit 1 }
          Write-Host "Textpose captured."
          $golden = "..\oracle\textpose\textpose.golden.json"
          if (Test-Path $golden) {
            & node ..\oracle\scripts\diff-dumps.mjs $golden ..\oracle\textpose\textpose.json
            if ($LASTEXITCODE -ne 0) { Write-Host "TEXTPOSE GOLDEN MISMATCH"; exit 1 }
            Write-Host "Textpose golden match."
          } else {
            Write-Host "No textpose golden yet - freeze by committing as textpose.golden.json"
          }

      - name: Capture avatario (Tier-1 #3 dump: emotion quantization round-trip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path oracle\avatario | Out-Null
          Set-Location v2.5-beta-1-modern
          & Release\OracleHarness.exe --avatario ..\oracle\avatario\avatario.json
          if ($LASTEXITCODE -ne 0) { Write-Host "AVATARIO CAPTURE FAILED (exit $LASTEXITCODE)"; exit 1 }
          Write-Host "Avatario captured."
          $golden = "..\oracle\avatario\avatario.golden.json"
          if (Test-Path $golden) {
            & node ..\oracle\scripts\diff-dumps.mjs $golden ..\oracle\avatario\avatario.json
            if ($LASTEXITCODE -ne 0) { Write-Host "AVATARIO GOLDEN MISMATCH"; exit 1 }
            Write-Host "Avatario golden match."
          } else {
            Write-Host "No avatario golden yet - freeze by committing as avatario.golden.json"
          }

      - name: Capture avatar-pose (Tier-1 #2 dump: emotion-to-pose selection)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path oracle\avatar | Out-Null
          Set-Location v2.5-beta-1-modern
          & Release\OracleHarness.exe --avatar-pose ..\oracle\avatar\avatar.json
          if ($LASTEXITCODE -ne 0) { Write-Host "AVATAR CAPTURE FAILED (exit $LASTEXITCODE)"; exit 1 }
          Write-Host "Avatar-pose captured."
          $golden = "..\oracle\avatar\avatar.golden.json"
          if (Test-Path $golden) {
            & node ..\oracle\scripts\diff-dumps.mjs $golden ..\oracle\avatar\avatar.json
            if ($LASTEXITCODE -ne 0) { Write-Host "AVATAR GOLDEN MISMATCH"; exit 1 }
            Write-Host "Avatar golden match."
          } else {
            Write-Host "No avatar golden yet - freeze by committing as avatar.golden.json"
          }

      # Tier-1 stateless codecs: mode maps (#9), formatting codec (#7), IRC
      # line parse (#6), URL detection (#8, aimed at the live
      # CUrlRec::HrIdentifyUrls rather than the dead urlfind.cpp), and the
      # CDosKey ring buffer (#12).
      - name: Capture codecs (Tier-1 #6/#7/#8/#9/#12)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path oracle\codecs | Out-Null
          Set-Location v2.5-beta-1-modern
          & Release\OracleHarness.exe --codecs ..\oracle\codecs\codecs.json
          if ($LASTEXITCODE -ne 0) { Write-Host "CODECS CAPTURE FAILED (exit $LASTEXITCODE)"; exit 1 }
          Write-Host "Codecs captured."
          $golden = "..\oracle\codecs\codecs.golden.json"
          if (Test-Path $golden) {
            & node ..\oracle\scripts\diff-dumps.mjs $golden ..\oracle\codecs\codecs.json
            if ($LASTEXITCODE -ne 0) { Write-Host "CODECS GOLDEN MISMATCH"; exit 1 }
            Write-Host "Codecs golden match."
          } else {
            Write-Host "No codecs golden yet - freeze by committing as codecs.golden.json"
          }

      - name: Judge validation - determinism (two identical runs)
        shell: cmd
        run: |
          cd v2.5-beta-1-modern
          if not exist ..\oracle\corpus\001 mkdir ..\oracle\corpus\001
          Release\OracleHarness.exe ..\oracle\corpus\001\inputs.json ..\oracle\corpus\001\run_a.json
          if errorlevel 1 exit /b 1
          Release\OracleHarness.exe ..\oracle\corpus\001\inputs.json ..\oracle\corpus\001\run_b.json
          if errorlevel 1 exit /b 1
          node ..\oracle\scripts\diff-dumps.mjs ..\oracle\corpus\001\run_a.json ..\oracle\corpus\001\run_b.json
          if errorlevel 1 (
            echo DETERMINISM CHECK FAILED: two runs with same seed produced different output
            exit /b 1
          )
          echo "Determinism check passed: two runs are byte-identical."

      # Tier-1 #10: the .ccc transcript codec. Byte-exact WriteSelf goldens for
      # all nine entry keywords plus parse-then-serialise identity. Passes the
      # tree dir because the parse constructors need a CChatDoc.
      - name: Capture ccc transcript codec (Tier-1 #10)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path oracle\ccc | Out-Null
          Set-Location v2.5-beta-1-modern
          & Release\OracleHarness.exe --ccc ..\oracle\ccc\ccc.json .
          if ($LASTEXITCODE -ne 0) { Write-Host "CCC CAPTURE FAILED (exit $LASTEXITCODE)"; exit 1 }
          Write-Host "Ccc captured."
          $golden = "..\oracle\ccc\ccc.golden.json"
          if (Test-Path $golden) {
            & node ..\oracle\scripts\diff-dumps.mjs $golden ..\oracle\ccc\ccc.json
            if ($LASTEXITCODE -ne 0) { Write-Host "CCC GOLDEN MISMATCH"; exit 1 }
            Write-Host "Ccc golden match."
          } else {
            Write-Host "No ccc golden yet - freeze by committing as ccc.golden.json"
          }

      # Runs BEFORE the corpus comparison on purpose: it used to follow it, so a
      # red corpus round skipped schema validation entirely - exactly the round
      # whose dumps you are about to freeze from. It needs no harness output.
      # ajv comes from oracle/package.json (pinned + lockfile) rather than an
      # unpinned ad-hoc install. node resolves it from oracle/node_modules
      # because validate.mjs lives in oracle/scripts/, so the validator can be
      # invoked from the repo root as before. CI=true makes validate.mjs fail
      # rather than silently degrade to structural checks if ajv is missing.
      - name: Validate corpus against schemas
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile --dir oracle
          if ($LASTEXITCODE -ne 0) { exit 1 }
          node oracle/scripts/validate.mjs --corpus oracle/corpus
          if ($LASTEXITCODE -ne 0) { exit 1 }
        env:
          CI: "true"

      # Every case runs even after one fails, then the step fails at the end.
      # Exiting on the first mismatch hid the state of every later case, which
      # made a deliberate re-freeze (adding a dump field invalidates all
      # goldens at once) cost one CI round per case. Each case is its own
      # process, so continuing after a crash is safe too - and the uploaded
      # actual.json set is then complete enough to freeze from in one pass.
      - name: Run corpus cases (compare against frozen goldens)
        shell: pwsh
        run: |
          Set-Location v2.5-beta-1-modern
          $corpusDir = Resolve-Path ..\oracle\corpus
          $cases = Get-ChildItem -Path $corpusDir -Directory | Where-Object { Test-Path "$($_.FullName)\inputs.json" } | Sort-Object Name
          $crashed = @()
          $mismatched = @()
          $matched = @()
          $unfrozen = @()
          foreach ($case in $cases) {
            $name = $case.Name
            Write-Host "--- Running case $name"
            $inp = "$($case.FullName)\inputs.json"
            $actual = "$($case.FullName)\actual.json"
            & Release\OracleHarness.exe $inp $actual
            if ($LASTEXITCODE -ne 0) {
              Write-Host "CASE $name FAILED (harness crash, exit $LASTEXITCODE)"
              $crashed += $name
              continue
            }
            $expected = "$($case.FullName)\expected.json"
            if (Test-Path $expected) {
              & node ..\oracle\scripts\diff-dumps.mjs $expected $actual
              if ($LASTEXITCODE -ne 0) {
                Write-Host "GOLDEN MISMATCH $name : corpus diverged from frozen golden"
                $mismatched += $name
              } else {
                Write-Host "GOLDEN MATCH $name"
                $matched += $name
              }
            } else {
              Write-Host "No golden for $name - wrote actual.json (freeze by committing as expected.json)"
              $unfrozen += $name
            }
          }
          Write-Host ""
          Write-Host "=== corpus summary ==="
          Write-Host "matched   : $($matched.Count) [$($matched -join ' ')]"
          Write-Host "mismatched: $($mismatched.Count) [$($mismatched -join ' ')]"
          Write-Host "crashed   : $($crashed.Count) [$($crashed -join ' ')]"
          Write-Host "unfrozen  : $($unfrozen.Count) [$($unfrozen -join ' ')]"
          if ($crashed.Count -gt 0 -or $mismatched.Count -gt 0) { exit 1 }


      # Deliberately LAST of the capture steps. It used to sit before the corpus
      # comparison, and when 33 manifests legitimately mismatched after a field was
      # added to the dump, the corpus step was skipped entirely - hiding the state
      # of the 15 cases in exactly the round where the hooks might have perturbed
      # them. Same reasoning that put schema validation before the corpus.
      # Tier-2: one manifest per ComicArt asset (25 .avb + 7 .bgb), covering the
      # avbfile.cpp record walk and the dib.cpp image decode. Sharded per asset
      # rather than one dump, so a mismatch names the asset that moved.
      #
      # Loops over every asset before failing, like the corpus step and for the
      # same reason: adding a field to the manifest invalidates all 32 goldens at
      # once, and re-freezing that one asset per CI round would be absurd.
      - name: Capture avb/bgb asset manifests (Tier-2)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path oracle\avb | Out-Null
          Set-Location v2.5-beta-1-modern
          & Release\OracleHarness.exe --avb ..\oracle\avb ComicArt
          if ($LASTEXITCODE -ne 0) { Write-Host "AVB CAPTURE FAILED (exit $LASTEXITCODE)"; exit 1 }
          Write-Host "Avb manifests captured."
          $avbDir = Resolve-Path ..\oracle\avb

          # Determinism gate, BEFORE the golden comparison. The pixel CRCs were
          # briefly hashing whole scan lines including row padding, which
          # ConvertMasksCommon leaves uninitialised - so 25 of 33 manifests
          # differed between two runs. That surfaced only when a freeze round came
          # back red, one wasted round. Two runs diffed catches it immediately,
          # and it is what the corpus step has always done for case 001.
          $runB = Join-Path $env:RUNNER_TEMP "avb_runb"
          New-Item -ItemType Directory -Force -Path $runB | Out-Null
          & Release\OracleHarness.exe --avb $runB ComicArt
          if ($LASTEXITCODE -ne 0) { Write-Host "AVB SECOND CAPTURE FAILED (exit $LASTEXITCODE)"; exit 1 }
          $unstable = @()
          foreach ($a in (Get-ChildItem -Path $avbDir -Filter *.json | Where-Object { $_.Name -notlike '*.golden.json' })) {
            $b = Join-Path $runB $a.Name
            if (-not (Test-Path $b)) { $unstable += ($a.Name + " (missing in run B)"); continue }
            if ((Get-FileHash $a.FullName).Hash -ne (Get-FileHash $b).Hash) { $unstable += $a.Name }
          }
          if ($unstable.Count -gt 0) {
            Write-Host "AVB DETERMINISM FAILED: $($unstable.Count) manifest(s) differ between two runs"
            Write-Host "  $($unstable -join ' ')"
            & node ..\oracle\scripts\diff-dumps.mjs (Join-Path $avbDir $unstable[0]) (Join-Path $runB $unstable[0])
            exit 1
          }
          Write-Host "Avb determinism check passed: two runs are byte-identical."
          # Drive off the captures, not the goldens: iterating goldens would
          # silently pass if the harness stopped emitting an asset entirely.
          $captures = Get-ChildItem -Path $avbDir -Filter *.json |
                      Where-Object { $_.Name -notlike '*.golden.json' } | Sort-Object Name
          $mismatched = @()
          $matched = @()
          $unfrozen = @()
          foreach ($cap in $captures) {
            $stem = $cap.Name -replace '\.json$', ''
            $golden = Join-Path $avbDir "$stem.golden.json"
            if (Test-Path $golden) {
              & node ..\oracle\scripts\diff-dumps.mjs $golden $cap.FullName
              if ($LASTEXITCODE -ne 0) {
                Write-Host "AVB GOLDEN MISMATCH $stem"
                $mismatched += $stem
              } else {
                $matched += $stem
              }
            } else {
              $unfrozen += $stem
            }
          }
          Write-Host ""
          Write-Host "=== avb summary ==="
          Write-Host "matched   : $($matched.Count) [$($matched -join ' ')]"
          Write-Host "mismatched: $($mismatched.Count) [$($mismatched -join ' ')]"
          Write-Host "unfrozen  : $($unfrozen.Count) [$($unfrozen -join ' ')]"
          if ($mismatched.Count -gt 0) { exit 1 }

      - name: Upload oracle artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: oracle-artifacts-${{ github.sha }}
          path: |
            oracle/glyphs/glyphs.json
            oracle/glyphs/glyphs.actual.json
            oracle/textpose/textpose.json
            oracle/textpose/textpose.golden.json
            oracle/avatario/avatario.json
            oracle/avatario/avatario.golden.json
            oracle/avatar/avatar.json
            oracle/avatar/avatar.golden.json
            oracle/codecs/codecs.json
            oracle/codecs/codecs.golden.json
            oracle/ccc/ccc.json
            oracle/ccc/ccc.golden.json
            # Captures only - the exclusion below matters. `oracle/avb/*.json`
            # also matches the 33 committed *.golden.json, which made the
            # artifact 66 files and turned a freeze-from-artifact loop into
            # *.golden.golden.json. @actions/glob takes exclusions as their own
            # `!`-prefixed line; extglob like !(*.golden).json is not supported.
            oracle/avb/*.json
            !oracle/avb/*.golden.json
            oracle/corpus/*/expected.json
            oracle/corpus/*/actual.json
            oracle/corpus/*/run_a.json
            oracle/corpus/*/run_b.json
          if-no-files-found: warn
          retention-days: 30